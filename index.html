<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OMG × 綠界｜訂單發票核對</title>
  <style>
    :root { --ink:#18212c; --muted:#667486; --line:#e5eaf0; --bg:#f5f7fa; --card:#fff; --brand:#176b62; --brand-pale:#e7f5f1; --warn:#9b5d08; --warn-pale:#fff5dc; --danger:#b23e3e; --shadow:0 12px 36px rgba(28,45,66,.09); }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--bg); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif; }
    button, input { font:inherit; }
    .top { min-height:164px; padding:34px max(28px,calc((100% - 1320px)/2)); color:#fff; background:linear-gradient(120deg,#123f47,#1d786d); }
    .eyebrow { margin:0 0 9px; font-size:13px; font-weight:700; letter-spacing:.11em; opacity:.78; }
    h1 { margin:0; font-size:30px; letter-spacing:-.03em; }
    .subtitle { margin:10px 0 0; color:#d9f0ed; font-size:15px; }
    main { max-width:1320px; margin:-35px auto 48px; padding:0 28px; }
    .toolbar, .table-card { background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:16px; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:17px 20px; }
    .source-label { display:flex; gap:11px; align-items:center; min-width:0; }
    .dot { width:10px; height:10px; flex:0 0 auto; border-radius:50%; background:#c9d2dc; }
    .dot.ready { background:#26a879; box-shadow:0 0 0 4px #e4f7ef; }
    .source-copy { min-width:0; }
    .source-name { font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:340px; }
    .source-help { margin-top:2px; color:var(--muted); font-size:12px; }
    .actions { display:flex; align-items:center; gap:10px; }
    button { cursor:pointer; border:0; border-radius:9px; font-weight:700; }
    .button { padding:10px 14px; color:#fff; background:var(--brand); }
    .button:hover { background:#11584f; }
    .button.secondary { color:#28554f; background:var(--brand-pale); }
    .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:15px; margin:22px 0; }
    .metric { padding:18px 20px; background:#fff; border:1px solid var(--line); border-radius:14px; }
    .metric .value { display:block; margin-bottom:5px; font-size:27px; font-weight:800; letter-spacing:-.04em; }
    .metric .label { color:var(--muted); font-size:13px; }
    .table-card { overflow:hidden; }
    .table-head { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px 16px; padding:17px 20px; border-bottom:1px solid var(--line); }
    .table-head h2 { margin:0; font-size:16px; }
    .view-controls { display:flex; align-items:center; gap:5px; padding:4px; background:#f1f4f6; border-radius:9px; }
    .view-controls label { padding:7px 10px; border-radius:6px; color:#596778; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; }
    .view-controls input { position:absolute; opacity:0; pointer-events:none; }
    .view-controls label:has(input:checked) { color:#155c53; background:#fff; box-shadow:0 1px 3px rgba(26,43,59,.12); }
    .filter { width:min(300px,50%); padding:9px 11px; color:var(--ink); outline:none; border:1px solid #d7dfe8; border-radius:8px; }
    .filter:focus { border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-pale); }
    .criteria { display:flex; flex:1 1 100%; gap:9px; }
    .criteria select { min-width:150px; padding:9px 11px; color:var(--ink); background:#fff; outline:none; border:1px solid #d7dfe8; border-radius:8px; }
    .criteria select:focus { border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-pale); }
    .table-wrap { overflow:auto; max-height:calc(100vh - 360px); min-height:200px; }
    table { width:100%; border-collapse:separate; border-spacing:0; font-size:13px; }
    th { position:sticky; top:0; z-index:1; text-align:left; white-space:nowrap; color:#536173; background:#f8fafc; font-weight:700; }
    th, td { padding:13px 14px; border-bottom:1px solid #edf0f4; vertical-align:top; }
    td { max-width:220px; line-height:1.45; }
    tbody tr:hover td { background:#fbfefd; }
    .status { display:inline-block; padding:3px 8px; border-radius:20px; font-size:12px; font-weight:700; white-space:nowrap; }
    .status.matched { color:#15714f; background:#e7f7ef; }
    .status.unmatched { color:var(--warn); background:var(--warn-pale); }
    .empty { padding:64px 20px; text-align:center; color:var(--muted); }
    dialog { width:min(780px,calc(100vw - 32px)); padding:0; color:var(--ink); border:0; border-radius:18px; box-shadow:0 25px 80px rgba(11,28,44,.35); }
    dialog::backdrop { background:rgba(15,28,43,.55); backdrop-filter:blur(3px); }
    .modal { padding:28px; }
    .modal h2 { margin:0; font-size:24px; }
    .modal > p { margin:9px 0 23px; color:var(--muted); line-height:1.55; }
    .drop-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .drop-zone { position:relative; display:flex; flex-direction:column; justify-content:center; min-height:176px; padding:19px; border:2px dashed #bfccd6; border-radius:13px; transition:.15s; }
    .drop-zone.drag, .drop-zone.ready { background:#f0faf8; border-color:#48a496; }
    .drop-zone input { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; }
    .file-kind { color:var(--brand); font-size:13px; font-weight:800; letter-spacing:.06em; }
    .drop-title { margin:10px 0 5px; font-size:17px; font-weight:800; }
    .drop-note { color:var(--muted); font-size:13px; line-height:1.45; }
    .file-name { margin-top:13px; color:#147264; font-size:12px; font-weight:700; word-break:break-all; }
    .modal-foot { display:flex; justify-content:flex-end; gap:10px; margin-top:24px; }
    .modal-foot .button:disabled { cursor:not-allowed; opacity:.45; }
    .error { display:none; margin-top:16px; padding:10px 12px; color:#9d3030; background:#fff0f0; border-radius:8px; font-size:13px; }
    .error.show { display:block; }
    @media (max-width:720px) { .top { padding:25px 20px 55px; } h1 { font-size:25px; } main { padding:0 15px; } .toolbar { align-items:stretch; flex-direction:column; } .actions { justify-content:flex-end; } .summary { grid-template-columns:1fr; gap:10px; } .drop-grid { grid-template-columns:1fr; } .table-head { align-items:stretch; flex-direction:column; } .view-controls { overflow-x:auto; } .criteria { width:100%; flex-direction:column; } .criteria select, .filter { width:100%; } }
  </style>
</head>
<body>
  <header class="top"><p class="eyebrow">ORDER &amp; INVOICE RECONCILIATION</p><h1>OMG × 綠界核對中心</h1><p class="subtitle">以「廠商訂單編號」與綠界「自訂編號」自動交叉比對，完整保留雙方未配對資料。</p></header>
  <main>
    <section class="toolbar" aria-label="資料來源">
      <div class="source-label"><span class="dot" id="omgDot"></span><div class="source-copy"><div class="source-name" id="omgName">尚未選擇 OMG 檔案</div><div class="source-help">需包含「廠商訂單編號」欄位</div></div></div>
      <div class="source-label"><span class="dot" id="ecpayDot"></span><div class="source-copy"><div class="source-name" id="ecpayName">尚未選擇 綠界檔案</div><div class="source-help">需包含「發票號碼」欄位</div></div></div>
      <div class="actions"><button class="button secondary" id="exportBtn" disabled>匯出核對結果</button><button class="button" id="chooseBtn">選擇檔案</button></div>
    </section>
    <section class="summary" aria-label="核對摘要">
      <div class="metric"><span class="value" id="totalCount">—</span><span class="label">合併資料總筆數</span></div>
      <div class="metric"><span class="value" id="matchedCount">—</span><span class="label">成功交易</span></div>
      <div class="metric"><span class="value" id="unmatchedCount">—</span><span class="label">異常資料</span></div>
    </section>
    <section class="table-card">
      <div class="table-head"><h2>合併核對明細</h2><div class="view-controls" role="radiogroup" aria-label="顯示範圍"><label><input type="radio" name="view" value="all" checked />所有資料</label><label><input type="radio" name="view" value="success" />成功交易</label><label><input type="radio" name="view" value="abnormal" />異常資料</label></div><div class="criteria" aria-label="欄位篩選"><select id="paymentStatusFilter" disabled><option value="__all__">付款狀態：全部</option></select><select id="settlementStatusFilter" disabled><option value="__all__">撥款狀態：全部</option></select><select id="changeFilter" disabled><option value="__all__">異動：全部</option></select><input class="filter" id="filter" type="search" placeholder="搜尋訂單、發票、商品名稱…" disabled /></div></div>
      <div class="table-wrap"><table id="resultTable"><thead><tr id="headers"></tr></thead><tbody id="results"><tr><td colspan="12" class="empty">請先選擇 OMG 與綠界的 CSV 檔案。</td></tr></tbody></table></div>
    </section>
  </main>
  <dialog id="fileDialog">
    <form class="modal" method="dialog">
      <h2>匯入核對檔案</h2><p>請各選一份 CSV 或 Excel 檔案。系統會依欄位自動辨識來源；比對鍵為 OMG「廠商訂單編號」＝ 綠界「自訂編號」。</p>
      <div class="drop-grid">
        <label class="drop-zone" id="omgZone"><input id="omgFile" type="file" accept=".csv,.xlsx,.xls,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" /><span class="file-kind">OMG 金流報表</span><span class="drop-title">選擇 OMG 檔案</span><span class="drop-note">CSV 或 Excel；包含「廠商訂單編號」</span><span class="file-name" id="omgFileName"></span></label>
        <label class="drop-zone" id="ecpayZone"><input id="ecpayFile" type="file" accept=".csv,.xlsx,.xls,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" /><span class="file-kind">綠界發票報表</span><span class="drop-title">選擇 綠界檔案</span><span class="drop-note">CSV 或 Excel；包含「發票號碼」與「自訂編號」</span><span class="file-name" id="ecpayFileName"></span></label>
      </div>
      <div class="error" id="error"></div>
      <div class="modal-foot"><button class="button secondary" value="cancel">取消</button><button class="button" id="mergeBtn" value="default" disabled>開始核對</button></div>
    </form>
  </dialog>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    const outputColumns = [
      ['訂單日期', 'omg'], ['廠商訂單編號', 'omg'], ['歐買尬金流訂單編號', 'omg'], ['付款方式', 'omg'], ['付款狀態', 'omg'], ['交易金額', 'omg'], ['撥款狀態', 'omg'], ['商品名稱', 'omg'], ['發票號碼', 'ecpay'], ['上傳狀態', 'ecpay'], ['異動', 'ecpay'], ['核對結果', 'status']
    ];
    const state = { omg:null, ecpay:null, rows:[] };
    const $ = id => document.getElementById(id);
    const clean = value => String(value ?? '').replace(/^\uFEFF/, '').replace(/^\s*=\s*/, '').trim();
    function parseCsv(text) {
      const rows = []; let row = [], field = '', quoted = false;
      text = text.replace(/^\uFEFF/, '');
      for (let i=0; i<text.length; i++) { const ch=text[i], next=text[i+1];
        if (ch === '"') { if (quoted && next === '"') { field+='"'; i++; } else quoted=!quoted; }
        else if (ch === ',' && !quoted) { row.push(clean(field)); field=''; }
        else if ((ch === '\n' || ch === '\r') && !quoted) { if (ch==='\r' && next==='\n') i++; row.push(clean(field)); if (row.some(x=>x!=='')) rows.push(row); row=[]; field=''; }
        else field+=ch;
      }
      row.push(clean(field)); if (row.some(x=>x!=='')) rows.push(row);
      const headers = rows.shift()?.map(clean) || [];
      return rows.map(values => Object.fromEntries(headers.map((h,i)=>[h,clean(values[i])])));
    }
    function readFile(file) {
      const isCsv = file.name.toLowerCase().endsWith('.csv');
      if (isCsv) return new Promise((resolve,reject) => { const r=new FileReader(); r.onload=()=>resolve(parseCsv(r.result)); r.onerror=()=>reject(new Error('檔案讀取失敗')); r.readAsText(file, 'utf-8'); });
      if (!/\.(xlsx|xls)$/i.test(file.name)) return Promise.reject(new Error('僅支援 CSV、XLSX 與 XLS 格式。'));
      if (!window.XLSX) return Promise.reject(new Error('Excel 讀取元件尚未載入。請確認網路連線後重新整理頁面。'));
      return file.arrayBuffer().then(buffer => {
        const workbook = XLSX.read(buffer, { type:'array', raw:false });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(firstSheet, { defval:'', raw:false });
        return rows.map(row => Object.fromEntries(Object.entries(row).map(([header,value]) => [clean(header), clean(value)])));
      });
    }
    function setupPicker(type) {
      const input=$(type+'File'), zone=$(type+'Zone');
      input.addEventListener('change', () => { const file=input.files[0]; if (!file) return; zone.classList.add('ready'); $(type+'FileName').textContent=file.name; validateSelections(); });
      ['dragenter','dragover'].forEach(event => zone.addEventListener(event,e=>{e.preventDefault();zone.classList.add('drag')}));
      ['dragleave','drop'].forEach(event => zone.addEventListener(event,e=>{e.preventDefault();zone.classList.remove('drag')}));
      zone.addEventListener('drop',e=>{ const file=e.dataTransfer.files[0]; if (!file) return; const data=new DataTransfer();data.items.add(file);input.files=data.files;input.dispatchEvent(new Event('change')); });
    }
    function validateSelections() { $('mergeBtn').disabled = !($('omgFile').files[0] && $('ecpayFile').files[0]); }
    function fail(message) { $('error').textContent=message; $('error').classList.add('show'); }
    // 綠界未配對時 ecpay 會是 undefined；一律回傳空字串，讓表格顯示「—」。
    function get(row, field) { return row?.[field] || ''; }
    // OMG 報表的付款／撥款狀態有時會在前方帶入時間，核對時僅保留狀態文字。
    function displayValue(row, source, field) {
      const value=get(row[source], field);
      if (source==='omg' && field==='付款狀態' && value.includes('已付款')) return '已付款';
      if (source==='omg' && field==='撥款狀態' && value.includes('已撥款')) return '已撥款';
      return value;
    }
    function isSuccess(row) { return Boolean(row.omg && get(row.omg, '付款狀態').includes('已付款') && get(row.ecpay, '發票號碼') && get(row.ecpay, '異動') !== '已作廢'); }
    function outcome(row) {
      if (isSuccess(row)) return '成功交易';
      if (!row.omg) return '綠界有發票、OMG 無訂單';
      if (!row.ecpay) return 'OMG 有訂單、未找到發票';
      if (!get(row.ecpay, '發票號碼')) return '綠界未找到發票';
      if (get(row.ecpay, '異動') === '已作廢') return '發票已作廢';
      return '付款未完成';
    }
    function merge() {
      const invoiceByOrder = new Map();
      state.ecpay.forEach(row => { const key=get(row,'自訂編號'); if (key && !invoiceByOrder.has(key)) invoiceByOrder.set(key,row); });
      const omgOrderNumbers = new Set(state.omg.map(row => get(row, '廠商訂單編號')).filter(Boolean));
      const omgRows = state.omg.map(omg => ({ omg, ecpay:invoiceByOrder.get(get(omg,'廠商訂單編號')) }));
      // 綠界有發票、但沒有對應 OMG 訂單的手開發票，也納入結果。
      const ecpayOnlyRows = state.ecpay.filter(ecpay => get(ecpay, '發票號碼') && !omgOrderNumbers.has(get(ecpay, '自訂編號'))).map(ecpay => ({ omg:null, ecpay }));
      state.rows = [...omgRows, ...ecpayOnlyRows];
      setFilterOptions();
      render(); $('fileDialog').close();
    }
    function setFilterOptions() {
      const configure = (id, label, values) => {
        const select=$(id), selected=select.value;
        const options=[...new Set(values)].sort((a,b)=>a.localeCompare(b, 'zh-Hant'));
        select.innerHTML=`<option value="__all__">${label}：全部</option>` + options.map(value => `<option value="${escapeHtml(value)}">${escapeHtml(value || '未填寫')}</option>`).join('');
        select.value=options.includes(selected) ? selected : '__all__'; select.disabled=false;
      };
      configure('paymentStatusFilter', '付款狀態', state.rows.map(row=>displayValue(row, 'omg', '付款狀態')));
      configure('settlementStatusFilter', '撥款狀態', state.rows.map(row=>displayValue(row, 'omg', '撥款狀態')));
      configure('changeFilter', '異動', state.rows.map(row=>get(row.ecpay, '異動')));
    }
    function render() {
      $('headers').innerHTML=outputColumns.map(([name])=>`<th>${name}</th>`).join('');
      const view=document.querySelector('input[name="view"]:checked').value;
      const payment=$('paymentStatusFilter').value, settlement=$('settlementStatusFilter').value, change=$('changeFilter').value;
      const renderRows = state.rows.filter(row => { const q=$('filter').value.trim().toLowerCase(), success=isSuccess(row); const inView=view==='all' || (view==='success' ? success : !success); const matchesFields=(payment==='__all__'||displayValue(row,'omg','付款狀態')===payment) && (settlement==='__all__'||displayValue(row,'omg','撥款狀態')===settlement) && (change==='__all__'||get(row.ecpay,'異動')===change); const searchable=outputColumns.some(([name,source]) => (source==='status' ? outcome(row) : displayValue(row,source,name)).toLowerCase().includes(q)); return inView && matchesFields && (!q || searchable); });
      $('results').innerHTML=renderRows.length ? renderRows.map(row => { const success=isSuccess(row), result=outcome(row); return `<tr>${outputColumns.map(([name,source]) => source==='status' ? `<td><span class="status ${success?'matched':'unmatched'}">${result}</span></td>` : `<td>${escapeHtml(displayValue(row,source,name)) || '<span style="color:#a0abb7">—</span>'}</td>`).join('')}</tr>`; }).join('') : '<tr><td colspan="12" class="empty">沒有符合目前檢視或搜尋條件的資料。</td></tr>';
      const successful=state.rows.filter(isSuccess).length;
      $('totalCount').textContent=state.rows.length.toLocaleString(); $('matchedCount').textContent=successful.toLocaleString(); $('unmatchedCount').textContent=(state.rows.length-successful).toLocaleString();
      $('filter').disabled=false; $('exportBtn').disabled=false;
    }
    function escapeHtml(v) { return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function csvCell(value) { return '"'+String(value ?? '').replace(/"/g,'""')+'"'; }
    function exportResults() { const lines=[outputColumns.map(x=>csvCell(x[0])).join(',')]; state.rows.forEach(row=>lines.push(outputColumns.map(([name,source])=>csvCell(source==='status'?outcome(row):displayValue(row,source,name))).join(','))); const blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='OMG_綠界核對結果.csv';a.click();URL.revokeObjectURL(a.href); }
    setupPicker('omg'); setupPicker('ecpay');
    $('chooseBtn').onclick=()=>{ $('error').classList.remove('show'); $('fileDialog').showModal(); };
    $('filter').oninput=render; ['paymentStatusFilter','settlementStatusFilter','changeFilter'].forEach(id=>$(id).onchange=render); document.querySelectorAll('input[name="view"]').forEach(input=>input.onchange=render); $('exportBtn').onclick=exportResults;
    $('mergeBtn').onclick=async e=> { e.preventDefault(); $('error').classList.remove('show'); try { const [first,second]=await Promise.all([readFile($('omgFile').files[0]),readFile($('ecpayFile').files[0])]); const firstHeaders=Object.keys(first[0]||{}), secondHeaders=Object.keys(second[0]||{}); state.omg=firstHeaders.includes('廠商訂單編號') ? first : secondHeaders.includes('廠商訂單編號') ? second : null; state.ecpay=firstHeaders.includes('發票號碼') ? first : secondHeaders.includes('發票號碼') ? second : null; if (!state.omg || !state.ecpay) throw new Error('無法辨識檔案。OMG 檔需有「廠商訂單編號」，綠界檔需有「發票號碼」。'); if (!Object.keys(state.ecpay[0]||{}).includes('自訂編號')) throw new Error('綠界檔案缺少「自訂編號」，無法與 OMG 訂單編號比對。'); $('omgName').textContent=$('omgFile').files[0].name; $('ecpayName').textContent=$('ecpayFile').files[0].name; $('omgDot').classList.add('ready'); $('ecpayDot').classList.add('ready'); merge(); } catch(err) { fail(err.message); } };
    $('fileDialog').showModal();
  </script>
</body>
</html>
